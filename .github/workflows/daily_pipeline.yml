name: Daily NSE Data Pipeline

on:
  schedule:
    # 11:30 UTC = 5:00 PM IST (Monday to Friday, after NSE Bhavcopy is published)
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Daily EOD Fetcher & Scoring Engine
        env:
          TZ: 'Asia/Kolkata'
        run: |
          python scripts/fetch_eod.py
          if [ "$(date +%u)" -eq 5 ]; then
            echo "Friday detected — refreshing weekly fundamentals..."
            python scripts/fetch_fundamentals.py
          fi
          python scripts/compute_signals.py

      - name: Commit Updated Parquet Files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/*.parquet
          git diff --staged --quiet || git commit -m "chore(data): EOD & signals update $(date +'%Y-%m-%d')"
          git push